info:
  contact: {}
  description: Movie reservation backend written in Go + Fiber.
  title: Movie Reservation API
  version: "1.0"
paths:
  /movies:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of movies, sorted by release date descending.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_toghrulabdullayev_movie-reservation-react-go_backend_internal_shared_pagination.PaginatedResponse-internal_features_movies_MovieResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all movies
      tags:
      - movies
  /movies/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a single movie including its associated genres.
      parameters:
      - description: Movie UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_movies.MovieResponse'
        "400":
          description: Bad Request - Invalid UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found - Movie not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie by ID
      tags:
      - movies
  /reservations:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all reservations with pagination.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Number of items per page
        in: query
        maximum: 100
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_toghrulabdullayev_movie-reservation-react-go_backend_internal_shared_pagination.PaginatedResponse-internal_features_reservations_ReservationResponse'
        "500":
          description: Internal Server Error - Failed to retrieve reservations
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all reservations
      tags:
      - reservations
    post:
      consumes:
      - application/json
      description: Create a new reservation with the provided details.
      parameters:
      - description: Reservation details
        in: body
        name: reservation
        required: true
        schema:

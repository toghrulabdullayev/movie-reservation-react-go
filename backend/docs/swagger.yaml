info:
  contact: {}
  description: Movie reservation backend written in Go + Fiber.
  title: Movie Reservation API
  version: "1.0"
paths:
  /movies:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of movies, sorted by release date descending.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_toghrulabdullayev_movie-reservation-react-go_backend_internal_shared_pagination.PaginatedResponse-internal_features_movies_MovieResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all movies
      tags:
      - movies
  /movies/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a single movie including its associated genres.
      parameters:
      - description: Movie UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_movies.MovieResponse'
        "400":
          description: Bad Request - Invalid UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found - Movie not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie by ID
      tags:
      - movies
  /rooms:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of all rooms.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_toghrulabdullayev_movie-reservation-react-go_backend_internal_shared_pagination.PaginatedResponse-internal_features_rooms_RoomResponse'
        "500":
          description: Internal Server Error - Failed to retrieve rooms
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all rooms with pagination
      tags:
      - rooms
    post:
      consumes:
      - application/json
      description: Create a new room with the provided details.
      parameters:
      - description: Room details
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/internal_features_rooms.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_rooms.RoomResponse'
        "400":
          description: Bad Request - Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error - Failed to create room
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new room
      tags:
      - rooms
  /rooms/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a room by its UUID.
      parameters:
      - description: Room UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content - Room deleted successfully
        "400":
          description: Bad Request - Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found - Room not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error - Failed to delete room
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete room by ID
      tags:
      - rooms
    get:
      consumes:
      - application/json
      description: Retrieve the details of a single room by its UUID.
      parameters:
      - description: Room UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_rooms.RoomResponse'
        "400":
          description: Bad Request - Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found - Room not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get room by ID
      tags:
      - rooms
    put:
      consumes:
      - application/json
      description: Update the details of a room by its UUID.
      parameters:
      - description: Room UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Updated room details
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/internal_features_rooms.UpdateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_rooms.RoomResponse'
        "400":
          description: Bad Request - Invalid input or ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found - Room not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error - Failed to update room
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update room by ID
      tags:
      - rooms
  /showtimes:
    get:
      consumes:
      - application/json
      description: Get a list of all showtimes currently registered in the system.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_showtimes.ShowtimeResponse'
            type: array
        "500":
          description: Internal Server Error - Failed to retrieve showtimes
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all showtimes
      tags:
      - showtimes
    post:
      consumes:
      - application/json
      description: Create a new showtime entry for a specific movie inside a specific
        theatre room.
      parameters:
      - description: Create showtime payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_showtimes.CreateShowtimeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_showtimes.ShowtimeResponse'
        "400":
          description: Bad Request - Invalid payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a showtime
      tags:
      - showtimes
  /showtimes/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a scheduled showtime from the database by its ID.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a showtime
      tags:
      - showtimes
    get:
      consumes:
      - application/json
      description: Retrieve the details of a single scheduled showtime by its UUID.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_showtimes.ShowtimeResponse'
        "400":
          description: Bad Request - Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found - Showtime not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get showtime by ID
      tags:
      - showtimes
    put:
      consumes:
      - application/json
      description: Modify parameters of a scheduled showtime by its ID.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Update showtime payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_showtimes.UpdateShowtimeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a showtime
      tags:
      - showtimes
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
